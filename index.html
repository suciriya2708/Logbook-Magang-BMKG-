<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Lookbook | Logbook Magang</title>

    <!-- File CSS -->
    <link rel="stylesheet" href="styles.css" />

    <!-- File JavaScript -->
    <script src="app.js" defer></script>
  </head>

  <body>
    <!-- Header -->
    <header>
      <h1>Lookbook</h1>
      <p>Kegiatan Magang</p>

      <!-- TAMBAHAN BARU: Tempat gambar mengambang -->
      <img id="gambar-random" class="img-mengambang" src="" alt="Dekorasi" />
    </header>

    <main class="container">
      <!-- Tombol Tambah Kegiatan -->
      <button type="button" id="btn-tambah" class="btn-primary">
        + Tambah Kegiatan Baru
      </button>

      <!-- Form Tambah Kegiatan -->
      <section id="form-section" hidden>
        <h2>Tambah Kegiatan</h2>

        <form id="form-kegiatan">
          <!-- Tanggal -->
          <div class="form-group">
            <label for="tanggal">Hari/Tanggal</label>
            <input type="date" id="tanggal" name="tanggal" required />
          </div>

          <!-- Aktivitas -->
          <div class="form-group">
            <label for="aktivitas">Aktivitas/Kegiatan</label>
            <textarea
              id="aktivitas"
              name="aktivitas"
              rows="4"
              placeholder="Tuliskan kegiatan magang..."
              required
            ></textarea>
          </div>

          <!-- Waktu -->
          <div class="form-row">
            <div class="form-group">
              <label for="mulai">Waktu Mulai</label>
              <input type="time" id="mulai" name="mulai" required />
            </div>

            <div class="form-group">
              <label for="selesai">Waktu Selesai</label>
              <input type="time" id="selesai" name="selesai" required />
            </div>
          </div>

          <!-- Dokumentasi -->
          <div class="form-group">
            <label for="foto">Dokumentasi (JPG/PNG)</label>
            <input
              type="file"
              id="foto"
              name="foto"
              accept=".jpg,.jpeg,.png,image/jpeg,image/png"
            />
          </div>

          <!-- Tombol Form -->
          <div class="form-actions">
            <button type="button" id="btn-batal" class="btn-secondary">
              Batal
            </button>

            <button type="submit" id="btn-submit" class="btn-primary">
              Simpan Kegiatan
            </button>
          </div>
        </form>
      </section>

      <!-- Daftar Kegiatan -->
      <section class="table-section">
        <div class="toolbar">
          <div>
            <h2>Daftar Kegiatan</h2>
            <p>Catatan kegiatan magang secara kronologis.</p>
          </div>
        </div>

        <!-- Pembungkus tabel agar responsif -->
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>No.</th>
                <th>Hari/Tanggal</th>
                <th>Aktivitas/Kegiatan</th>
                <th>Waktu</th>
                <th>Dokumentasi</th>
                <th>Aksi</th>
              </tr>
            </thead>

            <tbody id="daftar-kegiatan">
              <tr>
                <td colspan="6" class="empty-state">Memuat data...</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Navigasi halaman dibuat oleh JavaScript -->
      </section>

      <!-- Download Word -->
      <button type="button" id="btn-download-word" class="btn-primary">
        Download ke Word
      </button>
    </main>
  </body>
</html>
